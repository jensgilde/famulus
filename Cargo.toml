# Famulus v0.10.0 – Header-Version via env!("CARGO_PKG_VERSION")
# (Präferenz von Jens: Version im Build aus Cargo.toml, kein manuelles Setzen.)
#
# v0.10.0: UniFFI-Brücke für die native Swift-Hülle (swift-app/).
# Der Kern bleibt derselbe – die Brücke ist eine zusätzliche Schicht.
# (Muster: Famulus Games v0.2.0, dort bewährt.)

[workspace]
members = ["gui"]

[package]
name = "famulus-core"
version = "0.12.1"
edition = "2021"
description = "Famulus: persönlicher KI-Agent mit vollem Rechnerzugriff, austauschbarem LLM-Backend und harten Sicherheitsgrenzen."

[lib]
name = "famulus_core"
path = "src/lib.rs"
# staticlib: damit die Swift-Hülle den Kern statisch einlinken kann.
crate-type = ["lib", "staticlib"]

[[bin]]
name = "famulus"
path = "src/main.rs"

[[bin]]
name = "famulus-telegram"
path = "src/bin/telegram.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# Nur die Bausteine, die Famulus wirklich braucht - "full" zieht Netzwerk-
# Sockets, Signal-Handling und Zeitgeber mit, die hier nie angefasst werden.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",  # der Thread-Pool, auf dem die Schleife laeuft
    "macros",           # #[tokio::main]
    "fs",               # Dateien lesen/schreiben
    "process",          # run_shell
    "io-util",          # begrenztes Lesen grosser Dateien
    "time",             # Inaktivitaets-Timeout beim Lesen von Antwort-Stuecken
    "sync",             # mpsc-Kanal fuer Zwischenfragen (FFI-Bruecke)
] }
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"  # Chunk-Typ der gestreamten LLM-Antwort
futures-util = "0.3"  # StreamExt für die gestreamte LLM-Antwort
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
toml = "0.8"
dirs = "5"
colored = "2"
async-trait = "0.1"
libc = "0.2"  # setpgid/kill: run_shell-Timeout muss die ganze Prozessgruppe treffen
# Gedaechtnis: SQLite als einzelne Datei, kein Server. "bundled" heisst, die
# Datenbank wird mitkompiliert statt vom System geholt - dann haengt Famulus
# nicht an der SQLite-Version der jeweiligen Fedora-Installation.
rusqlite = { version = "0.32", features = ["bundled"] }
# UniFFI: FFI-Bruuecke zur nativen Swift-Huelle (swift-app/).
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
# "test-util" nur für Tests: lässt tokio::time::pause() virtuelle Zeit sofort
# vorspulen, statt in rufe_mit_wiederaufsetzen()-Tests echte 120s zu warten.
tokio = { version = "1", features = ["test-util"] }

# Ohne diesen Block baut Cargo Release-Binaries mit Debug-Symbolen und ohne
# Optimierung ueber Crate-Grenzen hinweg. Kostet laengere Release-Builds,
# spart dafuer gut die Haelfte der Dateigroesse.
[profile.release]
lto = "fat"          # Optimierung ueber Crate-Grenzen hinweg
codegen-units = 1    # langsamer uebersetzen, besser optimieren
strip = "symbols"    # Debug-Namen aus dem Binary werfen
