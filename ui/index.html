<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Famulus</title>
<style>
  :root {
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 13px; line-height: 1.6; font-weight: 400;
    -webkit-font-smoothing: antialiased;

    --bg-top: #211B16; /* Anker des durchgängigen Verlaufs Braun->Schwarz */
    --bg-primary: #211B16; --bg-secondary: #282019; --bg-tertiary: #2E251C;
    --bg-hover: #382A1E; --bg-active: #423222; --bg-input: #251D15;
    --bg-sidebar: #1D1712; --bg-code: #2A2117;

    --text-primary: #EDE3D5; --text-secondary: #C0B29E;
    --text-muted: #857763; --text-faint: #55493A;

    --accent: #F86E27; --accent-hover: #FF8A4A;
    --accent-muted: rgba(248,110,39,0.13);

    --border: #3A2C1F; --border-hover: #4E3B28; --border-focus: #63492F;
    --surface: #251D15; --surface-hover: #2E241A;

    --danger: #ff4444; --warning: #ffaa00; --success: #00cc66;
    --radius: 6px; --radius-lg: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /* Durchgängiger Verlauf: Braun oben -> Schwarz unten (v0.9.5).
     body zeichnet den Verlauf; alle Flächen darüber sind teiltransparent
     eingefärbt, damit der Verlauf als rote Linie durch die App läuft. */
  body {
    background: linear-gradient(180deg,
      var(--bg-top) 0%, #1B1511 22%, #151009 45%, #0B0806 70%, #000 100%);
    color: var(--text-primary);
    overflow: hidden; height: 100vh; width: 100vw;
  }
  #app { height: 100vh; width: 100vw; display: flex; flex-direction: column; }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    height: 36px; padding: 0 12px;
    background: rgba(27,21,17,0.88); border-bottom: 1px solid var(--border);
    user-select: none; flex-shrink: 0;
  }
  .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; }
  .toolbar-title { font-size: 11px; color: var(--text-muted); font-weight: 700; letter-spacing: .06em; margin-left: 2px; }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    transition: all .15s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .sidebar-toggle {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    width: 26px; height: 26px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    transition: all .15s; flex-shrink: 0;
  }
  .sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-toggle.active { border-color: var(--accent); color: var(--accent); background: var(--accent-muted); }

  /* ---- custom select (Provider / Modell), Obsin-Pillenform ---- */
  .model-select { position: relative; user-select: none; font-size: 11px; }
  .model-select-trigger {
    background: var(--bg-tertiary); border: 1px solid var(--border);
    color: var(--text-secondary); font-family: inherit; font-size: 11px;
    padding: 3px 22px 3px 10px; border-radius: 20px; cursor: pointer;
    white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    transition: border-color .2s; position: relative;
  }
  .model-select-trigger::after {
    content: ""; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 3px solid transparent; border-top-color: var(--text-muted);
  }
  .model-select.open .model-select-trigger, .model-select-trigger:hover {
    border-color: var(--accent); color: var(--text-primary);
  }
  .model-select-dropdown {
    display: none; position: absolute; top: 100%; right: 0; margin-top: 4px;
    background: var(--bg-tertiary); border: 1px solid var(--border-hover);
    border-radius: var(--radius); max-height: 280px; overflow-y: auto;
    z-index: 100; min-width: 200px;
  }
  .model-select.open .model-select-dropdown { display: block; }
  .model-select-option { padding: 6px 10px; cursor: pointer; color: var(--text-secondary); white-space: nowrap; font-size: 11px; }
  .model-select-option:hover, .model-select-option.active { background: var(--accent-muted); color: var(--text-primary); }

  /* ---- Layout ---- */
  .main-content { display: flex; flex: 1; overflow: hidden; }

  .sidebar { width: 240px; min-width: 240px; background: rgba(20,15,11,0.72); display: flex; flex-direction: column; flex-shrink: 0; transition: width .2s ease, min-width .2s ease, opacity .15s ease; }
  .left-sidebar { border-right: 1px solid var(--border); }
  .right-sidebar { border-left: 1px solid var(--border); }
  .sidebar.collapsed { width: 0; min-width: 0; padding: 0; opacity: 0; overflow: hidden; border: none; }

  .sidebar-header {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    color: var(--text-muted); text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }

  /* ---- Presets in rechter Sidebar ---- */
  .presets-area {
    padding: 8px; display: flex; flex-direction: column; gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .presets-area .model-select { width: 100%; }
  .presets-area .model-select-trigger {
    width: 100%; max-width: 100%; border-radius: 4px;
  }
  .presets-area .model-select-dropdown {
    left: 0; right: auto; min-width: 100%;
  }
  .sidebar-search {
    padding: 8px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sidebar-search input {
    width: 100%; box-sizing: border-box;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-primary); font-family: inherit;
    font-size: 11px; padding: 6px 8px;
    transition: border-color .2s;
  }
  .sidebar-search input:focus {
    outline: none; border-color: var(--accent);
  }
  .preset-textarea {
    width: 100%; min-height: 120px; max-height: 200px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-primary); font-family: inherit;
    font-size: 11px; line-height: 1.5; padding: 8px; resize: vertical;
    transition: border-color .2s;
  }
  .preset-textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .preset-actions {
    display: flex; gap: 4px; justify-content: flex-end;
  }
  .preset-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    width: 24px; height: 24px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    transition: all .15s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .preset-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .new-chat-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    transition: all .15s;
  }
  .new-chat-btn:hover { border-color: var(--accent); color: var(--accent); }

  .conversation-list { flex: 1; overflow-y: auto; padding: 4px; }
  .conversation-item {
    padding: 8px 10px; border-radius: var(--radius); cursor: pointer;
    font-size: 12px; color: var(--text-secondary); transition: background .12s;
    margin-bottom: 1px; display: flex; justify-content: space-between; align-items: flex-start;
  }
  .conversation-item:hover { background: var(--bg-hover); }
  .conversation-item.active { background: var(--bg-active); }
  .conv-info { overflow: hidden; flex: 1; min-width: 0; }
  .conv-title { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-meta { font-size: 10px; color: var(--text-faint); }
  .conv-delete {
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; font-size: 10px; padding: 2px 4px; border-radius: 3px;
    flex-shrink: 0; opacity: 0; transition: opacity .12s;
  }
  .conversation-item:hover .conv-delete { opacity: 1; }
  .conv-delete:hover { color: var(--danger); background: rgba(255,68,68,0.12); }

  .conv-restore {
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; font-size: 10px; padding: 2px 4px; border-radius: 3px;
    flex-shrink: 0; opacity: 0; transition: opacity .12s;
  }
  .conversation-item:hover .conv-restore { opacity: 1; }
  .conv-restore:hover { color: var(--success); background: rgba(0,204,102,0.12); }

  .conv-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .conv-archive {
    background: none; border: none; color: var(--text-faint);
    cursor: pointer; font-size: 11px; padding: 2px 4px; border-radius: 3px;
    flex-shrink: 0; opacity: 0; transition: opacity .12s;
  }
  .conversation-item:hover .conv-archive { opacity: 1; }
  .conv-archive:hover { color: var(--accent); background: var(--accent-muted); }

  /* ---- Chat Area ---- */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }

  .msg { margin-bottom: 16px; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { text-align: right; }
  .msg.assistant { text-align: left; }
  .msg.fehler { text-align: left; }

  .msg-role {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    margin-bottom: 4px; text-transform: uppercase;
  }
  .msg.user .msg-role { color: var(--accent); }
  .msg.assistant .msg-role { color: var(--text-muted); }
  .msg.fehler .msg-role { color: var(--danger); }
  .msg-zeit {
    font-size: 10px; font-weight: 400; letter-spacing: normal;
    text-transform: none; color: var(--text-faint); margin-left: 6px;
  }

  .msg-bubble {
    display: inline-block; max-width: 85%; text-align: left;
    padding: 10px 14px; border-radius: var(--radius-lg);
    font-size: 13px; line-height: 1.6; word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--accent-muted); color: var(--text-primary); }
  .msg.assistant .msg-bubble { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); }
  .msg.fehler .msg-bubble { background: rgba(255,68,68,0.08); color: var(--danger); border: 1px solid rgba(255,68,68,0.2); }

  .msg-bubble p { margin: 0 0 6px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble ul, .msg-bubble ol { margin: 4px 0; padding-left: 18px; }
  .msg-bubble li { margin-bottom: 2px; }
  .msg-bubble strong { color: var(--text-primary); font-weight: 700; }
  .msg-bubble em { color: var(--text-secondary); }
  .msg-bubble a { color: var(--accent); }
  .msg-bubble code {
    background: var(--bg-code); padding: 1px 5px; border-radius: 3px;
    font-size: 12px; color: var(--accent);
  }

  .denkt-text {
    font-size: 12px; color: var(--text-faint); font-style: italic;
    padding: 8px 14px; margin-bottom: 4px;
  }

  .agent-steps { margin-bottom: 8px; }
  .agent-step {
    font-size: 11px; color: var(--text-muted); padding: 4px 12px;
    cursor: pointer; display: flex; gap: 6px; align-items: flex-start;
    border-left: 2px solid var(--border); margin-left: 4px;
  }
  .agent-step:hover { color: var(--text-secondary); }
  .agent-step .step-icon { flex-shrink: 0; }
  .step-body { overflow: hidden; }
  .step-name { font-weight: 600; color: var(--text-secondary); }
  .step-result {
    display: none; margin-top: 4px; font-size: 10px; color: var(--text-faint);
    background: var(--bg-code); padding: 4px 8px; border-radius: 3px;
    white-space: pre-wrap; max-height: 120px; overflow-y: auto;
  }
  .agent-step.open .step-result { display: block; }

  .anhaenge-vorschau {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 20px 0;
  }
  .thumb {
    position: relative; width: 48px; height: 48px; border-radius: 4px;
    overflow: hidden; border: 1px solid var(--border);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb-remove {
    position: absolute; top: 0; right: 0;
    background: rgba(0,0,0,0.7); border: none; color: var(--danger);
    width: 16px; height: 16px; font-size: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .input-area { padding: 8px 20px 12px; }
  .input-row {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 6px 8px;
  }
  #eingabe {
    flex: 1; background: none; border: none;
    color: var(--text-primary);
    padding: 10px 14px; font-size: 13px; font-family: inherit;
    resize: none; outline: none; min-height: 42px; max-height: 180px;
    transition: border-color .2s; line-height: 1.5;
  }
  #eingabe:focus { border-color: var(--accent); }
  #eingabe::placeholder { color: var(--text-faint); }

  .upload-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-muted); width: 36px; height: 36px;
    border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0;
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent); }

  #senden {
    background: var(--accent); border: none; color: #000;
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: 14px; font-weight: 700; flex-shrink: 0;
    transition: background .15s, transform .1s;
    display: flex; align-items: center; justify-content: center;
  }
  #senden:hover { background: var(--accent-hover); }
  #senden:active { transform: scale(0.95); }

  #stoppBtn {
    background: none; border: 1px solid var(--border);
    color: var(--text-muted); width: 36px; height: 36px;
    border-radius: 50%; cursor: pointer; font-size: 14px;
    transition: all .15s; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stoppBtn:hover { border-color: var(--danger); color: var(--danger); }
  .mic-btn, .speak-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-muted); width: 36px; height: 36px;
    border-radius: 50%; cursor: pointer; font-size: 14px;
    flex-shrink: 0; transition: all .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .mic-btn:hover, .speak-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mic-btn.aktiv { border-color: var(--danger); color: var(--danger); background: rgba(255,68,68,0.1); }
  .mic-btn.aktiv:hover { color: var(--danger); }


  .statusbar {
    padding: 4px 20px; font-size: 10px; color: var(--text-faint);
    background: rgba(0,0,0,0.55); border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; flex-shrink: 0;
  }

  .code-block {
    margin: 8px 0; background: var(--bg-code); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .code-header {
    padding: 4px 10px; font-size: 10px; color: var(--text-faint);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between;
  }
  .code-block pre { padding: 10px; margin: 0; overflow-x: auto; font-size: 12px; }

  .error-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: rgba(255,68,68,0.12); color: var(--danger);
    padding: 6px 20px; font-size: 12px; text-align: center;
    border-bottom: 1px solid rgba(255,68,68,0.2);
  }

  .drop-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); align-items: center; justify-content: center;
  }
  .drop-overlay.dragging { display: flex; }
  .drop-hint {
    font-size: 24px; color: var(--accent); font-weight: 700;
    padding: 40px 60px; border: 3px dashed var(--accent);
    border-radius: var(--radius-lg); background: rgba(0,0,0,0.8);
  }

  /* Eigener Bestätigungsdialog: WKWebView (macOS) implementiert
     `runJavaScriptConfirmPanel` nicht, deshalb liefert das eingebaute
     window.confirm() dort still `false` zurück - Löschen passierte nie.
     Siehe wry 0.55.1, wry_web_view_ui_delegate.rs (nur OpenPanel und
     MediaCapture sind implementiert). */
  .confirm-overlay {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  .confirm-overlay.open { display: flex; }
  .confirm-box {
    background: var(--bg-tertiary); border: 1px solid var(--border-hover);
    border-radius: var(--radius-lg); padding: 20px 22px 16px;
    max-width: 380px; min-width: 280px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  .confirm-text {
    font-size: 13px; color: var(--text-primary);
    line-height: 1.5; margin-bottom: 18px; word-break: break-word;
  }
  .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .confirm-actions button {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    padding: 6px 14px; border-radius: var(--radius); font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .confirm-actions button:hover { border-color: var(--border-hover); color: var(--text-primary); }
  .confirm-actions button.danger { border-color: rgba(255,68,68,0.35); color: var(--danger); }
  .confirm-actions button.danger:hover { background: rgba(255,68,68,0.12); border-color: var(--danger); }

  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--text-faint); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
</style>
</head>
<body>

<div class="drop-overlay" id="dropOverlay"><div class="drop-hint">📎 Loslassen zum Hochladen</div></div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-actions">
      <button id="confirmAbbrechen">Abbrechen</button>
      <button id="confirmOk" class="danger">Löschen</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="sidebar-toggle" id="leftSidebarToggle" title="Chats ein-/ausblenden">☰</button>
      <span class="toolbar-title" id="versionDisplay">FAMULUS</span>
    </div>
    <div class="toolbar-right">
      <div class="model-select" id="providerSelect">
        <div class="model-select-trigger" id="providerTrigger">hyper</div>
        <div class="model-select-dropdown" id="providerDropdown"></div>
      </div>
      <div class="model-select" id="modelSelect">
        <div class="model-select-trigger" id="modelTrigger">Modell</div>
        <div class="model-select-dropdown" id="modelDropdown"></div>
      </div>
      <button class="sidebar-toggle" id="rightSidebarToggle" title="Archiv ein-/ausblenden">◫</button>
    </div>
  </div>

  <div class="main-content">
    <div class="sidebar left-sidebar collapsed" id="leftSidebar">
      <div class="sidebar-header">Chats <button class="new-chat-btn" id="neuerChatBtn" title="Neuer Chat">+</button></div>
      <div class="sidebar-search"><input type="text" id="suchEingabe" placeholder="Chats durchsuchen…"></div>
      <div class="conversation-list" id="conversationList"></div>
    </div>
    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="anhaenge-vorschau" id="anhaengeVorschau"></div>
        <div class="input-row">
          <input type="file" id="dateiEingabe" accept="image/*" multiple style="display:none" />
          <button class="mic-btn" id="micBtn" title="Spracheingabe (ohne Enter)">🎤</button>
          <button class="upload-btn" id="uploadBtn" title="Bild anhängen (auch: Strg+V oder Drag & Drop)">📎</button>
          <textarea id="eingabe" placeholder="Schreib Famulus einen Auftrag…" rows="1"></textarea>
          <button id="stoppBtn" title="Auftrag abbrechen" style="display:none">✕</button>
          <button id="senden">↑</button>
        </div>
      </div>
      <div class="statusbar">
        <span id="status">Bereit</span>
        <span id="zustand">Lade…</span>
        <span id="credits"></span>
      </div>
    </div>
    <div class="sidebar right-sidebar collapsed" id="rightSidebar">
      <div class="sidebar-header">Presets</div>
      <div class="presets-area">
        <div class="model-select" id="presetSelect">
          <div class="model-select-trigger" id="presetTrigger">Standard</div>
          <div class="model-select-dropdown" id="presetDropdown"></div>
        </div>
        <textarea class="preset-textarea" id="presetTextarea" placeholder="System-Prompt..."></textarea>
        <div class="preset-actions">
          <button class="preset-btn" id="presetSaveBtn" title="Speichern">✓</button>
          <button class="preset-btn" id="presetDeleteBtn" title="Löschen">✕</button>
        </div>
      </div>
      <div class="sidebar-header">Archiv</div>
      <div class="conversation-list" id="archivedList"></div>
    </div>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__?.core ?? {};
const { listen } = window.__TAURI__?.event ?? {};

// Ein einzelner Tippfehler (fehlendes DOM-Element, kaputter Selector) in

function presetCommand(fn) { return istIOS ? "remote_"+fn : fn; }

async function ladePresets() {
  try {
    presetsData = await invoke(presetCommand("presets_liste"));
    aktivesPreset = presetsData.active;
    renderPresetUI();
  } catch(e) { console.error("Presets laden:", e); }
}

function renderPresetUI() {
  if (!presetsData) return;
  presetDropdown.innerHTML = "";
  for (const p of presetsData.presets) {
    const div = document.createElement("div");
    div.className = "model-select-option" + (p.name === aktivesPreset ? " active" : "");
    div.textContent = p.name;
    div.addEventListener("click", () => presetsAktivieren(p.name));
    presetDropdown.appendChild(div);
  }
  presetTrigger.textContent = aktivesPreset || "Standard";
  
  const aktiv = presetsData.presets.find(p => p.name === aktivesPreset);
  if (aktiv) presetTextarea.value = aktiv.prompt;
}

async function presetsAktivieren(name) {
  try {
    presetsData = await invoke(presetCommand("presets_aktivieren"), { name });
    aktivesPreset = presetsData.active;
    renderPresetUI();
    presetSelect.classList.remove("open");
  } catch(e) { console.error("Preset aktivieren:", e); }
}

async function presetsSpeichern() {
  const name = aktivesPreset || "Standard";
  const prompt = presetTextarea.value.trim();
  if (!prompt) return;
  try {
    presetsData = await invoke(presetCommand("presets_speichern"), { name, prompt });
    renderPresetUI();
  } catch(e) { console.error("Preset speichern:", e); }
}

async function presetsLoeschen() {
  const name = aktivesPreset;
  if (!name || presetsData.presets.length <= 1) return;
  if (!await frageBestaetigung("Preset „" + name + "“ wirklich löschen?")) return;
  try {
    presetsData = await invoke(presetCommand("presets_loeschen"), { name });
    aktivesPreset = presetsData.active;
    renderPresetUI();
  } catch(e) { console.error("Preset löschen:", e); }
}

presetTrigger.addEventListener("click", () => presetSelect.classList.toggle("open"));

presetDeleteBtn.addEventListener("click", presetsLoeschen);

// ── Persistenz (SQLite) ─────────────────────────────────────────────────
const LS_SIDEBAR = 'famulus-sidebars';
const LS_MIGRATED = 'famulus-sqlite-migrated';

async function ladeChats() {
  // Migration von localStorage → SQLite beim ersten Start
  const migrated = localStorage.getItem(LS_MIGRATED);
  if (!migrated) {
    try {
      const old = JSON.parse(localStorage.getItem('famulus-chats') || '[]');
      const oldArchiv = JSON.parse(localStorage.getItem('famulus-archiv') || '[]');
      const oldAktiv = localStorage.getItem('famulus-aktiv');
      for (const c of [...old, ...oldArchiv]) {
        const archiviert = oldArchiv.some(a => a.id === c.id);
        await invoke('history_speichern', {
          id: null,
          titel: c.titel || 'Neuer Chat',
          nachrichten: JSON.stringify(c.nachrichten || [])
        });
        // Note: Archiv-Status wird nach dem Speichern gesetzt
      }
      if (old.length > 0 || oldArchiv.length > 0) {
        // Alte localStorage-Daten löschen
        localStorage.removeItem('famulus-chats');
        localStorage.removeItem('famulus-archiv');
        localStorage.removeItem('famulus-aktiv');
      }
      localStorage.setItem(LS_MIGRATED, '1');
    } catch(e) { console.error('Migration fehlgeschlagen:', e); }
  }

  // Aus SQLite laden
  try {
    const raw = await invoke('history_liste');
    chats = raw.map(e => ({
      id: String(e.id),
      titel: e.titel,
      nachrichten: JSON.parse(e.nachrichten || '[]'),
      createdAt: new Date(e.erstellt).getTime(),
      sqliteId: e.id
    }));
    const rawArchiv = await invoke('history_archiv_liste');
    archivedChats = rawArchiv.map(e => ({
      id: String(e.id),
      titel: e.titel,
      nachrichten: JSON.parse(e.nachrichten || '[]'),
      createdAt: new Date(e.erstellt).getTime(),
      sqliteId: e.id
    }));
  } catch(e) { console.error('Chats laden:', e); chats = []; archivedChats = []; }

  if (chats.length === 0) {
    const id = 'c' + Date.now();
    chats.push({ id, titel: 'Neuer Chat', nachrichten: [], createdAt: Date.now() });
    await speichereChats();
  }
  const aid = localStorage.getItem('famulus-aktiv');
  aktiverChatId = (aid && chats.find(c => c.id === aid)) ? aid : chats[0].id;
}

async function speichereChats() {
  localStorage.setItem('famulus-aktiv', aktiverChatId);
  for (const c of chats) {
    if (c.sqliteId) {
      await invoke('history_speichern', {
        id: c.sqliteId,
        titel: c.titel,
        nachrichten: JSON.stringify(c.nachrichten)
      }).catch(e => console.error('Chat speichern:', e));
    } else {
      const newId = await invoke('history_speichern', {
        id: null,
        titel: c.titel,
        nachrichten: JSON.stringify(c.nachrichten)
      }).catch(e => { console.error('Chat speichern:', e); return null; });
      if (newId) c.sqliteId = newId;
    }
  }
}

function aktiverChat() {
  let c = chats.find(c => c.id === aktiverChatId);
  if (!c) { aktiverChatId = chats[0].id; c = chats[0]; }
  return c;
}

function ladeSidebarZustand() {
  try {
    const z = JSON.parse(localStorage.getItem(LS_SIDEBAR) || '{}');
    return { left: z.left !== undefined ? z.left : false, right: z.right !== undefined ? z.right : false };
  } catch { return { left: false, right: false }; }
}

function speichereSidebarZustand(z) {
  localStorage.setItem(LS_SIDEBAR, JSON.stringify(z));
}

function setzeSidebar(seite, offen) {
  const sidebar = seite === 'left' ? leftSidebar : rightSidebar;
  const toggle = seite === 'left' ? leftSidebarToggle : rightSidebarToggle;
  if (offen) {
    sidebar.classList.remove('collapsed');
    toggle.classList.add('active');
  } else {
    sidebar.classList.add('collapsed');
    toggle.classList.remove('active');
  }
  const z = ladeSidebarZustand();
  z[seite] = offen;
  speichereSidebarZustand(z);
}

function toggleSidebar(seite) {
  const sidebar = seite === 'left' ? leftSidebar : rightSidebar;
  const istOffen = !sidebar.classList.contains('collapsed');
  setzeSidebar(seite, !istOffen);
}

leftSidebarToggle.addEventListener('click', () => toggleSidebar('left'));
rightSidebarToggle.addEventListener('click', () => toggleSidebar('right'));

function initSidebars() {
  const z = ladeSidebarZustand();
  setzeSidebar('left', z.left);
  setzeSidebar('right', z.right);
}

// ── Anhänge ──────────────────────────────────────────────────────────────

function fileZuBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const parts = dataUrl.split(',');
      const base64 = parts[1] || '';
      const medien_typ = (dataUrl.match(/^data:(.*?);/) || ['','application/octet-stream'])[1];
      resolve({ name: file.name, medien_typ, base64, dataUrl });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function anhaengeHinzufuegen(neue) {
  anhaenge.push(...neue);
  renderAnhaenge();
}

function anhangEntfernen(idx) {
  anhaenge.splice(idx, 1);
  renderAnhaenge();
}

function renderAnhaenge() {
  anhaengeVorschau.innerHTML = '';
  anhaenge.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.src = a.dataUrl;
    img.alt = a.name;
    img.title = a.name;
    const rm = document.createElement('button');
    rm.className = 'thumb-remove';
    rm.textContent = '✕';
    rm.onclick = () => anhangEntfernen(i);
    div.appendChild(img);
    div.appendChild(rm);
    anhaengeVorschau.appendChild(div);
  });
}

// ── Drag & Drop ──────────────────────────────────────────────────────────
let dragCounter = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; dropOverlay.classList.add('dragging'); });
document.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('dragging'); } });
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('dragging');
  const files = Array.from(e.dataTransfer.files);
  if (files.length === 0) return;
  const neue = [];
  for (const f of files) {
    if (f.type.startsWith('image/')) {
      neue.push(await fileZuBase64(f));
    }
  }
  if (neue.length > 0) anhaengeHinzufuegen(neue);
});

// ── Paste ────────────────────────────────────────────────────────────────
document.addEventListener('paste', async e => {
  const items = Array.from(e.clipboardData.items);
  const neue = [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      if (blob) {
        blob.name = 'paste-' + Date.now() + '.png';
        neue.push(await fileZuBase64(blob));
      }
    }
  }
  if (neue.length > 0) anhaengeHinzufuegen(neue);
});

// ── Formatierung ─────────────────────────────────────────────────────────
/// Datum/Uhrzeit klein neben "Du"/"Famulus". `ts` fehlt bei Nachrichten aus
/// der Zeit vor diesem Feature (alte Chats) - dann einfach nichts anzeigen,
/// statt ein falsches "jetzt" zu erfinden.
function formatZeit(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const heute = new Date();
  const selberTag = d.toDateString() === heute.toDateString();
  const uhrzeit = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  if (selberTag) return uhrzeit;
  const datum = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
  return `${datum} ${uhrzeit}`;
}

function formatText(text) {
  if (!text) return '';
  let escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Code-Blöcke ```
  escaped = escaped.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const langLabel = lang || 'code';
    return `<div class="code-block"><div class="code-header"><span>${langLabel}</span></div><pre>${code.trim()}</pre></div>`;
  });

  // Inline-Code `...`
  escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Fett **...**
  escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Kursiv *...*
  escaped = escaped.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  // Links
  escaped = escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');

  // Zeilenumbrüche
  escaped = escaped.replace(/\n/g, '<br>');

  return escaped;
}

function renderMessages() {
  const chat = aktiverChat();
  messagesEl.innerHTML = '';

  chat.nachrichten.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.rolle === 'user' ? 'user' : m.rolle === 'fehler' ? 'fehler' : 'assistant');

    if (m.rolle === 'user') {
      const roleEl = document.createElement('div');
      roleEl.className = 'msg-role';
      roleEl.innerHTML = `Du<span class="msg-zeit">${formatZeit(m.zeitstempel)}</span>`;
      div.appendChild(roleEl);
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatText(m.inhalt);
      div.appendChild(bubble);

      // Anhänge (Bilder) anzeigen, falls vorhanden
      if (m.anhaenge && m.anhaenge.length > 0) {
        const thumbs = document.createElement('div');
        thumbs.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;';
        m.anhaenge.forEach(a => {
          const img = document.createElement('img');
          img.src = `data:${a.medien_typ};base64,${a.base64}`;
          img.style.cssText = 'max-width:120px;max-height:120px;border-radius:4px;border:1px solid var(--border);';
          img.title = a.name;
          thumbs.appendChild(img);
        });
        div.appendChild(thumbs);
      }

    } else if (m.rolle === 'assistant') {
      const roleEl = document.createElement('div');
      roleEl.className = 'msg-role';
      roleEl.innerHTML = `Famulus<span class="msg-zeit">${formatZeit(m.zeitstempel)}</span>`;
      div.appendChild(roleEl);
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatText(m.inhalt);
      div.appendChild(bubble);
    } else if (m.rolle === 'fehler') {
      const roleEl = document.createElement('div');
      roleEl.className = 'msg-role';
      roleEl.innerHTML = `Fehler<span class="msg-zeit">${formatZeit(m.zeitstempel)}</span>`;
      div.appendChild(roleEl);
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = m.inhalt;
      div.appendChild(bubble);
    }

    messagesEl.appendChild(div);
  });

  renderLiveSchritte();
}

/// Baut nur den "läuft gerade"-Block (Denk-Text + Werkzeug-Schritte) neu und
/// hängt ihn ans Ende an - ohne die bereits fertigen Nachrichten anzufassen.
///
/// Während eines Zugs kommt pro Text-Chunk ein eigenes Ereignis rein, teils
/// mehrmals pro Sekunde (siehe der 'text'/'tool_start'/... Switch weiter
/// unten). Vorher hat jedes davon `renderMessages()` aufgerufen, das den
/// KOMPLETTEN Verlauf per `innerHTML = ''` wegwirft und neu aufbaut - jede
/// einzelne Nachricht spielt dann ihre `fadeIn`-Animation erneut ab, bei
/// jedem einzelnen Chunk, für den gesamten sichtbaren Chat. Das sah aus wie
/// ein ständig rutschender Chat, war aber ein ständig neu einsetzender
/// gesamter Verlauf. Diese Funktion fasst nur den einen, noch laufenden
/// Block an; abgeschlossene Nachrichten bleiben unangetastet.
function renderLiveSchritte() {
  const bestehend = messagesEl.querySelector('.msg.live');
  if (bestehend) bestehend.remove();

  if (aktuellerDenktText || aktuellerAgentSchritte.length > 0) {
    const div = document.createElement('div');
    div.className = 'msg assistant live';

    if (aktuellerDenktText) {
      const denk = document.createElement('div');
      denk.className = 'denkt-text';
      denk.textContent = '… ' + aktuellerDenktText;
      div.appendChild(denk);
    }

    if (aktuellerAgentSchritte.length > 0) {
      const steps = document.createElement('div');
      steps.className = 'agent-steps';
      aktuellerAgentSchritte.forEach((s, i) => {
        const step = document.createElement('div');
        step.className = 'agent-step' + (s.ergebnis !== null ? ' open' : '');
        const icon = s.art === 'werkzeug' ? '⚙' : '✎';
        step.innerHTML = `<span class="step-icon">${icon}</span><span class="step-body"><span class="step-name">${s.name || ''}</span>${s.text || ''}</span>`;
        if (s.art === 'werkzeug' && s.ergebnis !== null) {
          const result = document.createElement('div');
          result.className = 'step-result';
          result.textContent = s.ergebnis;
          result.style.display = 'block';
          step.appendChild(result);
        }
        step.addEventListener('click', () => step.classList.toggle('open'));
        steps.appendChild(step);
      });
      div.appendChild(steps);
    }

    messagesEl.appendChild(div);
  }

  scrolleNachUnten();
}

/// Ans Ende scrollen, nachdem der Browser das neue Layout tatsächlich
/// berechnet hat - `scrollHeight` direkt nach einer DOM-Änderung zu lesen
/// ist zwar synchron korrekt, aber `requestAnimationFrame` vermeidet, dass
/// die Zuweisung mit einem noch laufenden Layout-Task (z.B. Textarea-
/// Autoresize) kollidiert.
function scrolleNachUnten() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
  haengeTtsButtons();
}

    empty.style.cssText = 'padding:12px;font-size:11px;color:var(--text-faint);text-align:center;';
    empty.textContent = 'Keine archivierten Chats';

    return;
  }
  archivedChats.forEach(c => {

    div.className = 'conversation-item';
    div.innerHTML = `<div class="conv-info"><div class="conv-title">${c.titel || 'Chat'}</div><div class="conv-meta">${c.nachrichten.length} Nachrichten</div></div>`;

    const aktionen = document.createElement('div');
    aktionen.className = 'conv-actions';

    const restore = document.createElement('button');
    restore.className = 'conv-restore';
    restore.textContent = '↩';
    restore.title = 'Wiederherstellen';
    restore.addEventListener('click', e => { e.stopPropagation(); chatWiederherstellen(c.id); });
    aktionen.appendChild(restore);

    const del = document.createElement('button');
    del.className = 'conv-delete';
    del.textContent = '✕';
    del.title = 'Endgültig löschen';
    del.addEventListener('click', async e => {
      e.stopPropagation();
      if (await frageBestaetigung(`"${c.titel || 'Chat'}" endgültig löschen?`)) chatLoeschen(c.id);
    });
    aktionen.appendChild(del);

    div.appendChild(aktionen);
    div.addEventListener('click', () => {

      chatWiederherstellen(c.id);
      chatWechseln(c.id);
    });

  });

function renderStatusbar() {
  if (laeuft) {
    statusEl.innerHTML = '<span class="spinner"></span> Denkt…';
  } else {
    statusEl.textContent = 'Bereit';
  }
}

function beschaeftigt(b) {
  laeuft = b;
  // Eingabefeld bleibt während der Arbeit aktiv - sonst könnte man keine
  // Zwischenfrage tippen. Senden schickt während der Arbeit eine
  // Zwischenfrage statt eines neuen Auftrags; Abbrechen sitzt auf einem
  // eigenen Button, damit beides nebeneinander verfügbar ist.
  eingabe.disabled = false;
  senden.title = b ? 'Zwischenfrage senden' : 'Senden';
  stoppBtn.style.display = b ? '' : 'none';
  renderStatusbar();
}

/// Ersatz für window.confirm(), das in WKWebView auf macOS wirkungslos ist
/// (kein `runJavaScriptConfirmPanel` im UI-Delegate von wry - der Aufruf
/// liefert sofort `false`, ohne dass ein Fenster erscheint). Gibt ein
/// Promise<boolean> zurück; Enter = bestätigen, Escape/Klick daneben = nein.
function frageBestaetigung(text, okText) {
  const overlay = document.getElementById('confirmOverlay');
  const textEl = document.getElementById('confirmText');
  const okBtn = document.getElementById('confirmOk');
  const abbrBtn = document.getElementById('confirmAbbrechen');
  textEl.textContent = text;
  okBtn.textContent = okText || 'Löschen';
  overlay.classList.add('open');
  okBtn.focus();

  return new Promise(resolve => {
    // Ein einziger Aufräumpfad für alle Wege, den Dialog zu verlassen -
    // sonst blieben Listener liegen und der zweite Aufruf würde doppelt
    // auflösen.
    const fertig = (antwort) => {
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', aufOk);
      abbrBtn.removeEventListener('click', aufAbbruch);
      overlay.removeEventListener('click', aufHintergrund);
      document.removeEventListener('keydown', aufTaste);
      resolve(antwort);
    };
    const aufOk = () => fertig(true);
    const aufAbbruch = () => fertig(false);
    const aufHintergrund = (e) => { if (e.target === overlay) fertig(false); };
    const aufTaste = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); fertig(false); }
      else if (e.key === 'Enter') { e.preventDefault(); fertig(true); }
    };
    okBtn.addEventListener('click', aufOk);
    abbrBtn.addEventListener('click', aufAbbruch);
    overlay.addEventListener('click', aufHintergrund);
    document.addEventListener('keydown', aufTaste);
  });
}

function zeigeFehlerBanner(msg) {
  const el = document.createElement('div');
  el.className = 'error-banner';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── Chat-Verwaltung (SQLite) ──────────────────────────────────────────────

function chatWechseln(id) {
  aktiverChatId = id;
  speichereChats();
  renderAlles();
}

async function chatArchivieren(id) {
  const idx = chats.findIndex(c => c.id === id);
  if (idx === -1) return;
  const [chat] = chats.splice(idx, 1);
  archivedChats.push(chat);
  // War das der letzte aktive Chat, braucht es einen neuen - sonst stünde
  // die Chat-Liste leer da (dieselbe Logik wie beim allerersten Start,
  // siehe chatsLaden()).
  if (chats.length === 0) {
    const neueId = 'c' + Date.now();
    chats.push({ id: neueId, titel: 'Neuer Chat', nachrichten: [], createdAt: Date.now() });
    aktiverChatId = neueId;
  } else if (aktiverChatId === id) {
    aktiverChatId = chats[0].id;
  }
  if (chat.sqliteId) {
    await invoke('history_archivieren', { id: chat.sqliteId, archiviert: true }).catch(e => console.error('Archivieren:', e));
  }
  await speichereChats();
  renderAlles();
}

async function chatWiederherstellen(id) {
  const idx = archivedChats.findIndex(c => c.id === id);
  if (idx === -1) return;
  const [chat] = archivedChats.splice(idx, 1);
  chats.push(chat);
  if (chat.sqliteId) {
    await invoke('history_archivieren', { id: chat.sqliteId, archiviert: false }).catch(e => console.error('Wiederherstellen:', e));
  }
  await speichereChats();
  renderAlles();
}

async function chatLoeschen(id) {
  const chat = chats.find(c => c.id === id) || archivedChats.find(c => c.id === id);
  if (!chat) return;
  if (chat.sqliteId) {
    await invoke('history_loeschen', { id: chat.sqliteId }).catch(e => console.error('Löschen:', e));
  }
  chats = chats.filter(c => c.id !== id);
  archivedChats = archivedChats.filter(c => c.id !== id);
  // War das der letzte Chat, muss ein neuer her - sonst greift
  // aktiverChat() auf chats[0] zu, das es nicht mehr gibt, und
  // renderMessages() stirbt an "chats[0] is undefined" (gleiche Logik
  // wie in chatArchivieren()).
  if (chats.length === 0) {
    const neueId = 'c' + Date.now();
    chats.push({ id: neueId, titel: 'Neuer Chat', nachrichten: [], createdAt: Date.now() });
    aktiverChatId = neueId;
  } else if (aktiverChatId === id) {
    aktiverChatId = chats[0].id;
  }
  await speichereChats();
  renderAlles();
}

document.getElementById('neuerChatBtn').addEventListener('click', async () => {
  const id = 'c' + Date.now();
  chats.push({ id, titel: 'Neuer Chat', nachrichten: [], createdAt: Date.now() });

  await speichereChats();

});

// ── Suchleiste ───────────────────────────────────────────────────────────
let suchTimer = null;
document.getElementById('suchEingabe').addEventListener('input', async function() {
  const begriff = this.value.trim();
  clearTimeout(suchTimer);
  suchTimer = setTimeout(async () => {
    if (!begriff) {

      renderConversationList();
      return;

      } else {

// ── Provider/Modell-Auswahl ──────────────────────────────────────────────

let alleModelle = [];
let automatischeModellwahl = false;

async function ladeModelle() {
  try {
    const fn = istIOS ? 'remote_modelle_liste' : 'modelle_liste';
    const raw = await invoke(fn, { provider: aktuelleProvider });
    const arr = Array.isArray(raw) ? raw : (raw.data || raw.models || []);
    alleModelle = arr.map(m => ({
      id: m.id || m.name || m.slug || '',
      name: m.name || m.id || m.slug || '',
      context_length: m.context_length || m.context_window || 0,
    }));
    alleModelle.sort((a, b) => a.id.localeCompare(b.id));
    renderModelle();
  } catch (e) {
    console.error('Modelle laden fehlgeschlagen:', e);
    zeigeFehlerBanner('Modelle konnten nicht geladen werden: ' + e);
  }
}

function renderModelle() {
  const dropdown = document.getElementById('modelDropdown');
  dropdown.innerHTML = '';

  // Erste Option: Famulus entscheidet selbst (regelbasiert, siehe
  // agent.rs::ist_einfacher_auftrag) statt eines fest gewählten Modells.
  const auto = document.createElement('div');
  auto.className = 'model-select-option' + (automatischeModellwahl ? ' active' : '');
  auto.textContent = '⚙ Automatisch (Famulus wählt)';
  auto.addEventListener('click', async () => {
    document.getElementById('modelSelect').classList.remove('open');
    try {
      const fn = istIOS ? 'remote_setze_modell_modus' : 'setze_modell_modus';
      const z = await invoke(fn, { modus: 'automatisch' });
      automatischeModellwahl = true;
      zustandEl.textContent = z;
      document.getElementById('modelTrigger').textContent = 'Automatisch';
      renderModelle();
      ladeCredits();
    } catch (e) {
      zeigeFehlerBanner('Automatische Modellwahl fehlgeschlagen: ' + e);
    }
  });
  dropdown.appendChild(auto);

  alleModelle.forEach(m => {
    const div = document.createElement('div');
    div.className = 'model-select-option' + (!automatischeModellwahl && m.id === aktuellesModell ? ' active' : '');
    div.textContent = m.id;
    div.addEventListener('click', async () => {
      aktuellesModell = m.id;
      automatischeModellwahl = false;
      document.getElementById('modelTrigger').textContent = m.id;
      document.querySelectorAll('#modelDropdown .model-select-option').forEach(o => o.classList.remove('active'));
      div.classList.add('active');
      document.getElementById('modelSelect').classList.remove('open');
      try {
        const fn = istIOS ? 'remote_setze_modell' : 'setze_modell';
        const z = await invoke(fn, { provider: aktuelleProvider, model: m.id });
        zustandEl.textContent = z;
        ladeCredits();
      } catch (e) {
        zeigeFehlerBanner('Modell wechseln fehlgeschlagen: ' + e);
      }
    });
    dropdown.appendChild(div);
  });
  document.getElementById('modelTrigger').textContent =
    automatischeModellwahl ? 'Automatisch' : (aktuellesModell || 'Modell');
}

// ── Credits / Zustand / Version ──────────────────────────────────────────

async function ladeCredits() {
  try {
    const fn = istIOS ? 'remote_credits' : 'credits';
    const c = await invoke(fn);
    creditsEl.textContent = c;
    creditsEl.style.color = c.includes('$') || c.includes('€') || c.includes('¢') ? 'var(--success)' : 'var(--success)';
  } catch (e) {
    creditsEl.textContent = '';
    console.error('Credits:', e);
  }
}

async function ladeZustand() {
  try {
    const fn = istIOS ? 'remote_zustand' : 'zustand';
    const z = await invoke(fn);
    zustandEl.textContent = z;
    automatischeModellwahl = z.startsWith('automatisch');
    if (automatischeModellwahl) {
      document.getElementById('modelTrigger').textContent = 'Automatisch';
      renderModelle();
      return;
    }
    const teile = z.split(' · ');
    if (teile.length >= 2) {
      aktuelleProvider = teile[0];
      aktuellesModell = teile[1];
      document.getElementById('providerTrigger').textContent = aktuelleProvider;
      document.querySelectorAll('#providerDropdown .model-select-option').forEach(o => {
        o.classList.toggle('active', o.textContent === aktuelleProvider);
      });
    }
  } catch (e) {
    zustandEl.textContent = 'Offline';
  }
}

async function ladeVersion() {
  try {
    const fn = istIOS ? 'remote_version' : 'version';
    const v = await invoke(fn);
    versionDisplay.textContent = 'FAMULUS ' + v;
  } catch (e) {
    versionDisplay.textContent = 'FAMULUS';
  }
}

// ── Senden ───────────────────────────────────────────────────────────────

async function los() {
  const text = eingabe.value.trim();
  if (!text && anhaenge.length === 0) return;
  if (laeuft) return;

  const chat = aktiverChat();

  // Erste Nachricht: Titel setzen
  if (chat.nachrichten.length === 0 && text) {
    chat.titel = text.slice(0, 50) + (text.length > 50 ? '…' : '');
  }

  // Aktuelle Anhänge an die Nachricht hängen
  const aktuelleAnhaenge = [...anhaenge];
  anhaenge = [];
  renderAnhaenge();

  chat.nachrichten.push({
    rolle: 'user',
    inhalt: text || '(Bild)',
    anhaenge: aktuelleAnhaenge.map(a => ({ name: a.name, medien_typ: a.medien_typ, base64: a.base64 })),
    zeitstempel: Date.now(),
  });
  speichereChats();

  aktuellerAgentSchritte = [];
  aktuellerDenktText = '';
  eingabe.value = '';
  eingabe.style.height = 'auto';
  beschaeftigt(true);
  renderMessages();

  // Verlauf für den Server: alle Nachrichten außer der letzten (die schicken wir als Auftrag)
  const verlauf = chat.nachrichten.slice(0, -1).map(m => ({
    rolle: m.rolle === 'user' ? 'user' : 'assistant',
    inhalt: m.inhalt,
    anhaenge: (m.anhaenge || []).map(a => ({ name: a.name, medien_typ: a.medien_typ, base64: a.base64 })),
  }));

  try {
    const fn = istIOS ? 'remote_auftrag' : 'starte_auftrag';
    await invoke(fn, { auftrag: text || 'Beschreibe dieses Bild.', verlauf });
  } catch (e) {
    chat.nachrichten.push({ rolle: 'fehler', inhalt: String(e), zeitstempel: Date.now() });
    speichereChats();
    beschaeftigt(false);
    renderAlles();
    zeigeFehlerBanner('Fehler beim Senden: ' + e);
  }
}

/// Schickt eine Nachricht, während Famulus schon an etwas anderem arbeitet
/// - anders als los() wird dafür KEIN neuer Auftrag gestartet. Der Text
/// landet nur als Nachricht in der Anzeige und im laufenden Zug (siehe
/// agent.rs::run_task) - Famulus bekommt ihn vor der nächsten Antwort zu
/// sehen und kann ihn beiläufig mitbeantworten, ohne die eigentliche
/// Arbeit abzubrechen.
async function sendeZwischenfrage() {
  const text = eingabe.value.trim();
  if (!text) return;

  const chat = aktiverChat();
  chat.nachrichten.push({ rolle: 'user', inhalt: text, zeitstempel: Date.now() });
  speichereChats();

  eingabe.value = '';
  eingabe.style.height = 'auto';
  renderMessages();

  try {
    const fn = istIOS ? 'remote_zwischenfrage' : 'zwischenfrage';
    await invoke(fn, { text });
  } catch (e) {
    zeigeFehlerBanner('Zwischenfrage konnte nicht gesendet werden: ' + e);
  }
}

// ── STT: Spracheingabe ─────────────────────────────────────────────────────
let speechRecognition = null;
let micAktiv = false;

const micBtn = document.getElementById("micBtn");
micBtn.addEventListener("click", async () => {
  if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
    zeigeFehlerBanner("Spracherkennung wird in diesem Browser nicht unterstützt.");
    return;
  }
  if (micAktiv) {
    if (speechRecognition) speechRecognition.stop();
    micAktiv = false;
    micBtn.classList.remove("aktiv");
    return;
  }

  // webkitSpeechRecognition loest in Tauris WKWebView den macOS-
  // Mikrofon-Dialog NICHT selbst aus - das System fragt nur bei einem
  // eigenen getUserMedia nach. Ohne diesen Aufruf bleibt der TCC-
  // Eintrag leer und die Spracherkennung scheitert sofort mit
  // "not-allowed", ganz ohne dass Jens je gefragt wurde. Den Stream
  // selbst brauchen wir nicht - SpeechRecognition erfasst das Mikrofon
  // eigenstaendig - deshalb sofort wieder stoppen.
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {
    zeigeFehlerBanner("Mikrofon-Zugriff verweigert: " + e.message);
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  speechRecognition = new SR();
  speechRecognition.lang = "de-DE";
  speechRecognition.continuous = true;
  speechRecognition.interimResults = false;
  speechRecognition.onresult = (event) => {
    const letztes = event.results[event.results.length - 1];
    if (letztes.isFinal) {
      const text = letztes[0].transcript.trim();
      if (text) {
        eingabe.value = text;
        eingabe.style.height = "auto";
        eingabe.style.height = Math.min(eingabe.scrollHeight, 180) + "px";
        if (!laeuft) los();
      }
    }
  };
  speechRecognition.onerror = (e) => {
    if (e.error !== "aborted") zeigeFehlerBanner("Spracherkennung: " + e.error);
    micAktiv = false;
    micBtn.classList.remove("aktiv");
  };
  speechRecognition.onend = () => {
    micAktiv = false;
    micBtn.classList.remove("aktiv");
  };
  speechRecognition.start();
  micAktiv = true;
  micBtn.classList.add("aktiv");
});

// ── TTS: Sprachausgabe ─────────────────────────────────────────────────────
async function ttsSprich(text) {
  const plain = text.replace(/[*_`#>\/\[\]]/g, "").replace(/\n+/g, ". ").trim();
  if (!plain) return;
  try {
    await invoke("tts_sprich", { text: plain });
  } catch (e) {
    // Fehler bei TTS still ignorieren
  }
}

function haengeTtsButtons() {
  document.querySelectorAll(".msg.assistant .msg-role").forEach(roleEl => {
    if (roleEl.querySelector(".speak-btn")) return;
    const btn = document.createElement("button");
    btn.className = "speak-btn";
    btn.title = "Vorlesen";
    btn.textContent = "🔊";
    btn.style.cssText = "width:24px;height:24px;font-size:12px;margin-left:8px;border:1px solid var(--border);border-radius:50%;background:none;color:var(--text-muted);cursor:pointer;";
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const bubble = roleEl.parentElement?.querySelector(".msg-bubble");
      if (bubble) ttsSprich(bubble.textContent || "");
    });
    roleEl.appendChild(btn);
  });
}

senden.addEventListener('click', () => {
  if (laeuft) {
    sendeZwischenfrage();
  } else {
    los();
  }
});
stoppBtn.addEventListener('click', () => {
  invoke('stoppe_auftrag').catch(() => {});
});
eingabe.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); laeuft ? sendeZwischenfrage() : los(); }
});
eingabe.addEventListener('input', () => {
  eingabe.style.height = 'auto';
  eingabe.style.height = Math.min(eingabe.scrollHeight, 180) + 'px';
});

// Selbsttest des Ereigniskanals.
listen('famulus-kanaltest', () => invoke('kanal_steht'))
  .then(() => invoke('pruefe_kanal'))
  .catch(e => zeigeFehlerBanner(
    'Das Fenster darf nicht auf Ereignisse lauschen (' + e + '). Prüfe gui/capabilities/default.json.'));

listen('famulus-modell-gewechselt', e => {
  zustandEl.textContent = e.payload.provider + ' · ' + e.payload.model;
  aktuelleProvider = e.payload.provider;
  aktuellesModell = e.payload.model;
  ladeCredits();
});

listen('famulus-ereignis', e => {
  const ev = e.payload;
  const chat = aktiverChat();

  switch (ev.art) {
    case 'text':
      aktuellerDenktText = (aktuellerDenktText || '') + ev.chunk;
      renderLiveSchritte();
      renderStatusbar();
      break;
    case 'tool_start':
      aktuellerAgentSchritte.push({ art: 'werkzeug', name: ev.name, argumente: ev.args, ergebnis: null });
      aktuellerDenktText = '';
      renderLiveSchritte();
      renderStatusbar();
      break;
    case 'tool_end': {
      const letzter = [...aktuellerAgentSchritte].reverse().find(s => s.art === 'werkzeug' && s.name === ev.name && s.ergebnis === null);
      if (letzter) letzter.ergebnis = ev.inhalt;
      renderLiveSchritte();
      break;
    }
    case 'erinnert':
      aktuellerAgentSchritte.push({ art: 'gedaechtnis', text: `⌾ ${ev.anzahl} Erinnerungen im Kontext` });
      renderLiveSchritte();
      break;
    case 'gemmerkt':
      aktuellerAgentSchritte.push({ art: 'gedaechtnis', text: `✎ (${ev.kategorie}) ${ev.inhalt}` });
      renderLiveSchritte();
      break;
    case 'reflektiere':
      aktuellerAgentSchritte.push({ art: 'gedaechtnis', text: '⟳ Rückblick...' });
      renderLiveSchritte();
      break;
    case 'zwischenfrage_antwort':
      // Eigene, sofortige Antwort aus einem parallelen Aufruf - kommt NICHT
      // aus dem laufenden Hauptauftrag (der läuft unbeeinflusst weiter,
      // deshalb hier kein beschaeftigt(false)). Als fertige Chat-Nachricht
      // statt als Live-Schritt, damit sie klar von der Aufgaben-Erzählung
      // getrennt bleibt und nicht verschwindet, wenn der Hauptauftrag den
      // Live-Block irgendwann räumt.
      chat.nachrichten.push({
        rolle: 'assistant',
        inhalt: `↩ Zu „${ev.frage}":\n\n${ev.text}`,
        zeitstempel: Date.now(),
      });
      speichereChats();
      renderAlles();
      break;
    case 'warte':
      // Ein Zug ist fehlgeschlagen, wird aber automatisch wiederholt statt
      // den Auftrag abzubrechen (siehe agent.rs::rufe_mit_wiederaufsetzen).
      // Als Schritt statt als Fehler-Bubble, weil es (noch) kein Abbruch ist.
      aktuellerAgentSchritte.push({
        art: 'gedaechtnis',
        text: `⏳ Fehlgeschlagen (${ev.versuch}/${ev.max_versuche}), versuche in ${ev.sekunden}s erneut: ${ev.grund}`,
      });
      renderLiveSchritte();
      renderStatusbar();
      break;
    case 'modell_gewaehlt':
      // Bei automatischer Modellwahl kann sich das Modell von Auftrag zu
      // Auftrag ändern - hier sichtbar machen statt lautlos zu wechseln,
      // damit eine Fehleinschätzung sofort auffällt.
      zustandEl.textContent = `${ev.provider} · ${ev.model} · ${ev.grund}`;
      zustandEl.title = ev.grund;
      break;
    case 'fertig':
      chat.nachrichten.push({ rolle: 'assistant', inhalt: aktuellerDenktText || ev.chunk || '', zeitstempel: Date.now() });
      speichereChats();
      aktuellerAgentSchritte = [];
      aktuellerDenktText = '';
      beschaeftigt(false);
      renderAlles();
      ladeCredits();
      break;
    case 'abgebrochen':
      chat.nachrichten.push({ rolle: 'fehler', inhalt: ev.fehler, zeitstempel: Date.now() });
      speichereChats();
      aktuellerAgentSchritte = [];
      aktuellerDenktText = '';
      beschaeftigt(false);
      renderAlles();
      ladeCredits();
      break;
  }
});

  try {
    istIOS = await invoke('ist_ios').catch(() => false);
    await ladeChats();

  // regelmäßig neu abfragen statt nur bei eigenen Aktionen.
  setInterval(ladeCredits, 30000);
})();
