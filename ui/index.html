<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Famulus</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2c3038;
    --text: #e6e8ec;
    --dim: #8b929e;
    --akzent: #7aa2f7;
    --warn: #e0af68;
    --gut: #9ece6a;
    --schlecht: #f7768e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex: none;
    flex-wrap: wrap;
  }
  header b { font-size: 15px; white-space: nowrap; }
  header span { color: var(--dim); font-size: 12px; }

  /* Custom Dropdowns */
  .custom-select {
    position: relative; user-select: none; font-size: 12px;
  }
  .custom-select-trigger {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 24px 4px 10px; cursor: pointer;
    white-space: nowrap; min-width: 100px;
    position: relative;
  }
  .custom-select-trigger::after {
    content: ""; position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    border: 4px solid transparent;
    border-top-color: var(--dim);
  }
  .custom-select.open .custom-select-trigger { border-color: var(--akzent); }
  .custom-select-dropdown {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 0 0 6px 6px; max-height: 280px; overflow-y: auto;
    z-index: 100; margin-top: 2px; min-width: 180px;
  }
  .custom-select.open .custom-select-dropdown { display: block; }
  .custom-select-option {
    padding: 6px 10px; cursor: pointer; color: var(--text);
    white-space: nowrap;
  }
  .custom-select-option:hover, .custom-select-option.active {
    background: var(--akzent); color: #fff;
  }

  /* Credits */
  #credits {
    color: var(--gut); font-size: 12px; font-weight: 600;
    white-space: nowrap; margin-left: 4px;
  }

  #verlauf { flex: 1; overflow-y: auto; padding: 16px; }
  .zeile { margin-bottom: 10px; }
  .auftrag { color: var(--akzent); font-weight: 600; }
  .werkzeug {
    color: var(--warn); font-family: ui-monospace, monospace; font-size: 13px;
  }
  .ergebnis {
    margin: 4px 0 0 18px; padding: 8px 10px; background: var(--panel);
    border-left: 2px solid var(--line); border-radius: 4px;
    font-family: ui-monospace, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word;
    max-height: 220px; overflow-y: auto; color: var(--dim);
  }
  .antwort {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 12px 14px; white-space: pre-wrap;
  }
  .gedaechtnis { color: var(--dim); font-size: 12px; font-style: italic; }
  .fehler { color: var(--schlecht); white-space: pre-wrap; }
  .fertig { color: var(--gut); font-weight: 600; }
  /* Was das Modell sagt, bevor es zum Werkzeug greift. */
  .denkt { color: var(--dim); font-style: italic; white-space: pre-wrap; }

  button {
    font: inherit; padding: 8px 16px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--akzent); }
  button:disabled { opacity: .5; cursor: default; }

  footer {
    flex: none; display: flex; gap: 10px; padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  #eingabe {
    flex: 1; font: inherit; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  #eingabe:focus { outline: none; border-color: var(--akzent); }
</style>
</head>
<body>

<header>
  <b>Famulus</b>
  <span id="zustand">lädt …</span>
  <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
    <div class="custom-select" id="provider-cs">
      <div class="custom-select-trigger" id="provider-trigger">Hyper</div>
      <div class="custom-select-dropdown" id="provider-dropdown"></div>
    </div>
    <div class="custom-select" id="modell-cs">
      <div class="custom-select-trigger" id="modell-trigger">Modelle laden …</div>
      <div class="custom-select-dropdown" id="modell-dropdown"></div>
    </div>
    <span id="credits">—</span>
  </div>
</header>

<div id="verlauf"></div>

<footer>
  <input id="eingabe" placeholder="Auftrag eingeben und Enter drücken …" autofocus />
  <button id="senden">Los</button>
</footer>

<script>
const { invoke } = window.__TAURI__.core;
const { listen }  = window.__TAURI__.event;

const verlauf = document.getElementById('verlauf');
const eingabe = document.getElementById('eingabe');
const senden  = document.getElementById('senden');
const creditsEl = document.getElementById('credits');
const zustandEl = document.getElementById('zustand');

let laeuft = false;
let aktuelleProvider = 'hyper';
let aktuellesModell = '';
let alleModelle = [];
let creditsTimer = null;

// ---- Custom Select ----
function initCustomSelect(csId, triggerId, dropdownId) {
  const cs = document.getElementById(csId);
  const trigger = document.getElementById(triggerId);
  const dropdown = document.getElementById(dropdownId);

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    // Alle anderen schließen
    document.querySelectorAll('.custom-select.open').forEach(c => {
      if (c !== cs) c.classList.remove('open');
    });
    cs.classList.toggle('open');
  });

  document.addEventListener('click', () => cs.classList.remove('open'));
}

function fillDropdown(dropdownId, options, selectedValue, onChange) {
  const dropdown = document.getElementById(dropdownId);
  dropdown.innerHTML = '';
  options.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'custom-select-option';
    if (opt.value === selectedValue) div.classList.add('active');
    div.textContent = opt.label;
    div.addEventListener('click', () => {
      if (onChange) onChange(opt.value);
      document.getElementById(dropdownId).parentElement.classList.remove('open');
    });
    dropdown.appendChild(div);
  });
}

function setTrigger(triggerId, text) {
  document.getElementById(triggerId).textContent = text;
}

// Provider-Optionen
const providerOptions = [
  { value: 'hyper', label: 'Hyper' },
  { value: 'openrouter', label: 'OpenRouter' },
  { value: 'anthropic', label: 'Anthropic' },
  { value: 'grok', label: 'Grok' },
];

initCustomSelect('provider-cs', 'provider-trigger', 'provider-dropdown');
initCustomSelect('modell-cs', 'modell-trigger', 'modell-dropdown');

fillDropdown('provider-dropdown', providerOptions, aktuelleProvider, async (value) => {
  aktuelleProvider = value;
  setTrigger('provider-trigger', value === 'hyper' ? 'Hyper' : value === 'openrouter' ? 'OpenRouter' : value === 'anthropic' ? 'Anthropic' : 'Grok');
  // Bei Provider-Wechsel erstes Modell nehmen
  await ladeModelleFuerProvider(value);
  if (alleModelle.length > 0) {
    aktuellesModell = alleModelle[0].id;
    setTrigger('modell-trigger', alleModelle[0].display_name || alleModelle[0].id);
  }
  await setzeModell(value, aktuellesModell);
});

// ---- Modell laden ----
async function ladeModelleFuerProvider(provider) {
  try {
    alleModelle = await invoke('modelle_liste', { provider: provider });
    const opts = alleModelle.map(m => ({
      value: m.id,
      label: `${m.display_name || m.id} ($${(m.pricing||{}).input||'?'}/$${(m.pricing||{}).output||'?'})`
    }));
    fillDropdown('modell-dropdown', opts, aktuellesModell, async (value) => {
      aktuellesModell = value;
      const m = alleModelle.find(x => x.id === value);
      setTrigger('modell-trigger', (m && m.display_name) || value);
      await setzeModell(aktuelleProvider, value);
    });
  } catch (e) {
    document.getElementById('modell-dropdown').innerHTML = '<div class="custom-select-option">Fehler</div>';
    console.error('Modelle:', e);
  }
}

async function setzeModell(provider, model) {
  if (!model) return;
  try {
    const neu = await invoke('setze_modell', { provider, model });
    zustandEl.textContent = neu;
    ladeCredits();
  } catch (e) {
    zeile('fehler', 'Modellwechsel fehlgeschlagen: ' + e);
  }
}

// ---- Credits ----
async function ladeCredits() {
  try {
    const c = await invoke('credits');
    creditsEl.textContent = c === 'n/a' ? '—' : '💰 ' + c;
  } catch (e) {
    creditsEl.textContent = '—';
  }
}

// Auto-Refresh alle 30s
function starteCreditsTimer() {
  if (creditsTimer) clearInterval(creditsTimer);
  creditsTimer = setInterval(ladeCredits, 30000);
}

// ---- Init ----
invoke('zustand')
  .then(t => {
    zustandEl.textContent = t;
    const parts = t.split(' · ');
    if (parts.length >= 2) {
      aktuelleProvider = parts[0].trim();
      aktuellesModell = parts[1].trim();
    }
    // Provider-Trigger setzen
    const pl = providerOptions.find(p => p.value === aktuelleProvider);
    setTrigger('provider-trigger', pl ? pl.label : aktuelleProvider);
    fillDropdown('provider-dropdown', providerOptions, aktuelleProvider, async (value) => {
      aktuelleProvider = value;
      setTrigger('provider-trigger', value === 'hyper' ? 'Hyper' : value === 'openrouter' ? 'OpenRouter' : value === 'anthropic' ? 'Anthropic' : 'Grok');
      await ladeModelleFuerProvider(value);
      if (alleModelle.length > 0) {
        aktuellesModell = alleModelle[0].id;
        setTrigger('modell-trigger', alleModelle[0].display_name || alleModelle[0].id);
      }
      await setzeModell(value, aktuellesModell);
    });
    // Modelle laden
    return ladeModelleFuerProvider(aktuelleProvider);
  })
  .then(() => {
    // Aktuelles Modell im Trigger setzen
    const m = alleModelle.find(x => x.id === aktuellesModell);
    if (m) setTrigger('modell-trigger', m.display_name || m.id);
  })
  .catch(e => { zustandEl.textContent = 'Konfiguration fehlerhaft: ' + e; })
  .finally(() => {
    ladeCredits();
    starteCreditsTimer();
  });

function zeile(klasse, text) {
  const div = document.createElement('div');
  div.className = 'zeile';
  const inner = document.createElement('div');
  inner.className = klasse;
  inner.textContent = text;
  div.appendChild(inner);
  verlauf.appendChild(div);
  verlauf.scrollTop = verlauf.scrollHeight;
  return div;
}

function beschaeftigt(an) {
  laeuft = an;
  eingabe.disabled = an;
  senden.disabled = an;
  if (!an) eingabe.focus();
}

// Selbsttest
listen('famulus-kanaltest', () => invoke('kanal_steht'))
  .then(() => invoke('pruefe_kanal'))
  .catch(e => zeile('fehler',
    'Das Fenster darf nicht auf Ereignisse lauschen (' + e + '). '
    + 'Prüfe gui/capabilities/default.json.'));

listen('famulus-modell-gewechselt', e => {
  zustandEl.textContent = e.payload.provider + ' · ' + e.payload.model;
  aktuelleProvider = e.payload.provider;
  aktuellesModell = e.payload.model;
  ladeCredits();
});

async function los() {
  const auftrag = eingabe.value.trim();
  if (!auftrag || laeuft) return;
  eingabe.value = '';
  zeile('auftrag', '› ' + auftrag);
  beschaeftigt(true);
  try {
    await invoke('starte_auftrag', { auftrag });
  } catch (e) {
    zeile('fehler', 'Start fehlgeschlagen: ' + e);
    beschaeftigt(false);
  }
}

senden.addEventListener('click', los);
eingabe.addEventListener('keydown', e => { if (e.key === 'Enter') los(); });

listen('famulus-ereignis', e => {
  const ev = e.payload;
  switch (ev.art) {
    case 'gestartet':
      zeile('werkzeug', 'Provider: ' + ev.provider);
      break;
    case 'denkt':
      zeile('denkt', ev.text);
      break;
    case 'werkzeug_aufruf':
      zeile('werkzeug', '⚙ ' + ev.name + '(' + ev.argumente + ')');
      break;
    case 'erinnert':
      zeile('gedaechtnis', '⌾ ' + ev.anzahl + ' Erinnerungen im Kontext');
      break;
    case 'gelernt':
      zeile('gedaechtnis', '✎ ' + ev.anzahl + ' neu gemerkt');
      break;
    case 'werkzeug_ergebnis': {
      const box = document.createElement('div');
      box.className = 'ergebnis';
      box.textContent = ev.ergebnis;
      verlauf.appendChild(box);
      verlauf.scrollTop = verlauf.scrollHeight;
      break;
    }
    case 'fertig':
      zeile('fertig', '✔ Fertig');
      zeile('antwort', ev.antwort);
      beschaeftigt(false);
      ladeCredits();
      break;
    case 'abgebrochen':
      zeile('fehler', '✗ ' + ev.fehler);
      beschaeftigt(false);
      ladeCredits();
      break;
  }
});

</script>
</body>
</html>
